<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baker Library Battle Arena</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.9.0/dist/ethers.umd.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Press Start 2P', cursive;
      background-color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      image-rendering: pixelated;
    }

    .game-container {
      width: 800px;
      height: 600px;
      background-color: #98cb98;
      border: 8px solid #2d2d2d;
      border-radius: 8px;
      box-shadow: 0 0 0 4px #6b8c42, 8px 8px 0 0 rgba(0,0,0,0.3);
      overflow: hidden;
      position: relative;
      outline: none;
    }

    .screen {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
    }

    .screen.active {
      display: flex;
    }

    /* ========== TITLE SCREEN ========== */
    #title-screen {
      background: linear-gradient(180deg, #2d5a27 0%, #3d7a3d 50%, #98cb98 100%);
      justify-content: center;
      align-items: center;
      gap: 40px;
    }

    .game-title {
      color: #ffffd0;
      text-align: center;
      text-shadow: 4px 4px 0 #2d2d2d;
      line-height: 1.8;
    }

    .game-title .main { font-size: 20px; display: block; }
    .game-title .sub { font-size: 10px; display: block; margin-top: 10px; color: #90ee90; }

    .start-btn {
      background: #3d7a3d;
      color: #ffffd0;
      border: 4px solid #2d5a27;
      padding: 15px 40px;
      font-family: 'Press Start 2P', cursive;
      font-size: 12px;
      cursor: pointer;
    }

    .start-btn:hover { background: #4d9a4d; }

    /* ========== NAME ENTRY SCREEN ========== */
    #name-screen {
      background: #2d5a27;
      justify-content: center;
      align-items: center;
      gap: 30px;
    }

    .name-prompt {
      color: #ffffd0;
      font-size: 14px;
      text-shadow: 2px 2px 0 #1a3a17;
    }

    .name-input {
      background: #ffffd0;
      border: 4px solid #2d2d2d;
      padding: 15px 20px;
      font-family: 'Press Start 2P', cursive;
      font-size: 14px;
      width: 300px;
      text-align: center;
      text-transform: uppercase;
    }

    .name-input:focus { outline: none; border-color: #4d9a4d; }

    /* ========== OVERWORLD SCREEN ========== */
    #overworld-screen {
      background: #d4b896;
      position: relative;
    }

    .overworld {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    /* Floor pattern */
    .floor {
      position: absolute;
      width: 100%;
      height: 100%;
      background:
        repeating-linear-gradient(90deg, #d4b896 0px, #d4b896 32px, #c9a882 32px, #c9a882 64px),
        repeating-linear-gradient(0deg, #d4b896 0px, #d4b896 32px, #c9a882 32px, #c9a882 64px);
      background-size: 64px 64px;
    }

    /* Bookshelves (top wall) */
    .bookshelf {
      position: absolute;
      background: linear-gradient(180deg, #8b4513 0%, #654321 100%);
      border: 3px solid #3d2314;
    }

    .bookshelf::before {
      content: '';
      position: absolute;
      top: 5px;
      left: 5px;
      right: 5px;
      bottom: 5px;
      background: repeating-linear-gradient(
        90deg,
        #c41e3a 0px, #c41e3a 8px,
        #1e90ff 8px, #1e90ff 16px,
        #228b22 16px, #228b22 24px,
        #ffd700 24px, #ffd700 32px
      );
    }

    .bookshelf-top { top: 0; left: 0; width: 100%; height: 50px; }
    .bookshelf-left { top: 50px; left: 0; width: 40px; height: 250px; }
    .bookshelf-right { top: 50px; right: 0; width: 40px; height: 250px; }

    /* Study tables */
    .table {
      position: absolute;
      background: linear-gradient(180deg, #a0522d 0%, #8b4513 100%);
      border: 3px solid #654321;
      border-radius: 4px;
    }

    .table::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      right: 3px;
      bottom: 3px;
      background: #cd853f;
      border-radius: 2px;
    }

    /* Service desk */
    .service-desk {
      position: absolute;
      top: 220px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 70px;
      background: #654321;
      border: 4px solid #3d2314;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .service-desk::after {
      content: '?';
      color: #ffffd0;
      font-size: 24px;
    }

    /* Chandeliers */
    .chandelier {
      position: absolute;
      width: 40px;
      height: 30px;
      background: radial-gradient(ellipse, #ffd700 0%, #b8860b 100%);
      border-radius: 50% 50% 30% 30%;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
    }

    /* Windows */
    .window {
      position: absolute;
      top: 60px;
      width: 50px;
      height: 80px;
      background: linear-gradient(180deg, #87ceeb 0%, #add8e6 100%);
      border: 6px solid #654321;
    }

    .window::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      width: 4px;
      height: 100%;
      background: #654321;
      transform: translateX(-50%);
    }

    .window::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 4px;
      background: #654321;
      transform: translateY(-50%);
    }

    /* ========== PIXEL ART SPRITES ========== */
    .sprite {
      position: absolute;
      width: 32px;
      height: 48px;
      transition: left 0.1s, top 0.1s;
    }

    /* Human sprite base */
    .human-sprite {
      position: relative;
      width: 32px;
      height: 48px;
    }

    /* Head */
    .sprite-head {
      position: absolute;
      top: 0;
      left: 6px;
      width: 20px;
      height: 20px;
      background: #fdbf6f;
      border-radius: 50% 50% 40% 40%;
      border: 2px solid #d4a05a;
    }

    /* Hair */
    .sprite-hair {
      position: absolute;
      top: -2px;
      left: 4px;
      width: 24px;
      height: 12px;
      border-radius: 50% 50% 0 0;
    }

    /* Body */
    .sprite-body {
      position: absolute;
      top: 18px;
      left: 4px;
      width: 24px;
      height: 20px;
      border-radius: 4px 4px 0 0;
      border: 2px solid rgba(0,0,0,0.2);
    }

    /* Legs */
    .sprite-legs {
      position: absolute;
      top: 36px;
      left: 8px;
      width: 16px;
      height: 12px;
      background: #2d2d2d;
      border-radius: 0 0 4px 4px;
    }

    /* Player specific colors (HBS Crimson) */
    .player-sprite .sprite-hair { background: #4a3728; }
    .player-sprite .sprite-body { background: #a51c30; }

    /* Chad - PE Bro (Blue suit, slicked hair) */
    .chad-sprite .sprite-hair { background: #2d2d2d; height: 8px; }
    .chad-sprite .sprite-body { background: #1e3a5f; }
    .chad-sprite .sprite-legs { background: #1e3a5f; }

    /* Priya - Founder (Casual, dark hair) */
    .priya-sprite .sprite-hair { background: #1a1a1a; height: 14px; border-radius: 40% 40% 20% 20%; }
    .priya-sprite .sprite-body { background: #4a4a4a; }
    .priya-sprite .sprite-head { background: #c68642; border-color: #a67232; }

    /* Francois - Consultant (Gray suit) */
    .francois-sprite .sprite-hair { background: #5a4a3a; }
    .francois-sprite .sprite-body { background: #4a4a5a; }
    .francois-sprite .sprite-legs { background: #3a3a4a; }

    /* Sprite name label */
    .sprite-label {
      position: absolute;
      bottom: -18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 6px;
      color: #2d2d2d;
      white-space: nowrap;
      background: rgba(255,255,255,0.8);
      padding: 2px 4px;
      border-radius: 2px;
    }

    /* Interaction prompt */
    .interact-prompt {
      display: none;
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #2d2d2d;
      color: #ffffd0;
      padding: 10px 20px;
      font-size: 10px;
      border: 4px solid #ffffd0;
      z-index: 100;
    }

    .interact-prompt.active { display: block; }

    /* Movement instructions */
    .movement-hint {
      position: absolute;
      bottom: 10px;
      right: 10px;
      font-size: 7px;
      color: #654321;
      background: rgba(255,255,255,0.7);
      padding: 5px 8px;
      border-radius: 4px;
    }

    /* ========== BATTLE SCREEN ========== */
    #battle-screen {
      background: #98cb98;
    }

    .battle-scene {
      flex: 1;
      position: relative;
      background: linear-gradient(180deg, #87ceeb 0%, #98cb98 60%);
      overflow: hidden;
    }

    .opponent-area {
      position: absolute;
      top: 20px;
      right: 40px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .battle-sprite {
      width: 100px;
      height: 120px;
      margin-bottom: 10px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      transform: scale(2);
      transform-origin: bottom center;
    }

    .battle-sprite.hit {
      animation: shake 0.3s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: scale(2) translateX(0); }
      25% { transform: scale(2) translateX(-5px); }
      75% { transform: scale(2) translateX(5px); }
    }

    .hp-bar-container {
      background: #ffffd0;
      border: 4px solid #2d2d2d;
      padding: 8px;
      width: 180px;
    }

    .hp-label {
      display: flex;
      justify-content: space-between;
      font-size: 8px;
      margin-bottom: 5px;
    }

    .hp-bar {
      height: 12px;
      background: #2d2d2d;
      border-radius: 2px;
      overflow: hidden;
    }

    .hp-fill {
      height: 100%;
      background: linear-gradient(180deg, #4ade80 0%, #22c55e 50%, #16a34a 100%);
      transition: width 0.5s ease-out;
    }

    .hp-fill.low { background: linear-gradient(180deg, #fbbf24 0%, #f59e0b 50%, #d97706 100%); }
    .hp-fill.critical { background: linear-gradient(180deg, #f87171 0%, #ef4444 50%, #dc2626 100%); }

    .player-area {
      position: absolute;
      bottom: 20px;
      left: 40px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .battle-ui {
      height: 180px;
      background: #2d2d2d;
      display: flex;
      flex-direction: column;
    }

    .battle-log {
      flex: 1;
      background: #ffffd0;
      margin: 8px;
      border: 4px solid #6b8c42;
      padding: 10px;
      overflow-y: auto;
      font-size: 8px;
      line-height: 1.8;
    }

    .battle-log .log-entry { margin-bottom: 5px; }
    .battle-log .tx-hash { color: #2563eb; text-decoration: underline; cursor: pointer; word-break: break-all; }
    .battle-log .damage { color: #dc2626; }

    .move-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 8px;
    }

    .move-btn {
      background: #ffffd0;
      border: 4px solid #6b8c42;
      padding: 10px 8px;
      font-family: 'Press Start 2P', cursive;
      font-size: 8px;
      cursor: pointer;
      text-align: left;
    }

    .move-btn:hover:not(:disabled) { background: #ffffe0; }
    .move-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .move-name { display: block; margin-bottom: 4px; }
    .move-damage { font-size: 6px; color: #666; }

    /* ========== RESULT SCREEN ========== */
    #result-screen {
      background: #2d2d2d;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }

    .result-content {
      background: #ffffd0;
      border: 4px solid #6b8c42;
      padding: 30px;
      text-align: center;
      max-height: 80%;
      overflow-y: auto;
    }

    .result-title { font-size: 16px; margin-bottom: 20px; }
    .result-title.win { color: #16a34a; }
    .result-title.lose { color: #dc2626; }
    .result-stats { font-size: 8px; line-height: 2; margin-bottom: 20px; text-align: left; }
    .tx-list { font-size: 7px; text-align: left; max-height: 120px; overflow-y: auto; background: #f0f0f0; padding: 10px; margin-bottom: 20px; }
    .tx-list a { color: #2563eb; word-break: break-all; }

    .play-again-btn {
      background: #3d7a3d;
      color: #ffffd0;
      border: 4px solid #2d5a27;
      padding: 12px 25px;
      font-family: 'Press Start 2P', cursive;
      font-size: 8px;
      cursor: pointer;
    }

    /* ========== LOADING OVERLAY ========== */
    .loading-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .loading-overlay.active { display: flex; }
    .loading-text { color: #ffffd0; font-size: 10px; text-align: center; line-height: 2; }
    .spinner { width: 30px; height: 30px; border: 4px solid #ffffd0; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="game-container" tabindex="0" id="game-container">
    <!-- Title Screen -->
    <div id="title-screen" class="screen active">
      <div class="game-title">
        <span class="main">BAKER LIBRARY</span>
        <span class="main">BATTLE ARENA</span>
        <span class="sub">Tempo Testnet Edition</span>
      </div>
      <button class="start-btn" id="start-btn">PRESS START</button>
    </div>

    <!-- Name Entry Screen -->
    <div id="name-screen" class="screen">
      <div class="name-prompt">ENTER YOUR NAME</div>
      <input type="text" class="name-input" id="name-input" maxlength="12" placeholder="YOUR NAME">
      <button class="start-btn" id="name-submit">BEGIN</button>
    </div>

    <!-- Overworld Screen -->
    <div id="overworld-screen" class="screen">
      <div class="overworld" id="overworld">
        <div class="floor"></div>

        <!-- Bookshelves -->
        <div class="bookshelf bookshelf-top"></div>
        <div class="bookshelf bookshelf-left"></div>
        <div class="bookshelf bookshelf-right"></div>

        <!-- Windows -->
        <div class="window" style="left: 120px;"></div>
        <div class="window" style="left: 260px;"></div>
        <div class="window" style="left: 480px;"></div>
        <div class="window" style="left: 620px;"></div>

        <!-- Chandeliers -->
        <div class="chandelier" style="top: 100px; left: 200px;"></div>
        <div class="chandelier" style="top: 100px; left: 400px;"></div>
        <div class="chandelier" style="top: 100px; left: 600px;"></div>

        <!-- Service Desk -->
        <div class="service-desk"></div>

        <!-- Study Tables -->
        <div class="table" style="top: 320px; left: 100px; width: 100px; height: 60px;"></div>
        <div class="table" style="top: 320px; left: 600px; width: 100px; height: 60px;"></div>
        <div class="table" style="top: 450px; left: 320px; width: 160px; height: 60px;"></div>

        <!-- Player sprite (positioned by JS) -->
        <div class="sprite" id="player">
          <div class="human-sprite player-sprite">
            <div class="sprite-hair"></div>
            <div class="sprite-head"></div>
            <div class="sprite-body"></div>
            <div class="sprite-legs"></div>
          </div>
          <div class="sprite-label" id="player-label">YOU</div>
        </div>

        <!-- Trainer sprites -->
        <div class="sprite trainer" id="trainer-0" data-trainer="0" style="left: 120px; top: 350px;">
          <div class="human-sprite chad-sprite">
            <div class="sprite-hair"></div>
            <div class="sprite-head"></div>
            <div class="sprite-body"></div>
            <div class="sprite-legs"></div>
          </div>
          <div class="sprite-label">CHAD</div>
        </div>

        <div class="sprite trainer" id="trainer-1" data-trainer="1" style="left: 650px; top: 350px;">
          <div class="human-sprite priya-sprite">
            <div class="sprite-hair"></div>
            <div class="sprite-head"></div>
            <div class="sprite-body"></div>
            <div class="sprite-legs"></div>
          </div>
          <div class="sprite-label">PRIYA</div>
        </div>

        <div class="sprite trainer" id="trainer-2" data-trainer="2" style="left: 380px; top: 480px;">
          <div class="human-sprite francois-sprite">
            <div class="sprite-hair"></div>
            <div class="sprite-head"></div>
            <div class="sprite-body"></div>
            <div class="sprite-legs"></div>
          </div>
          <div class="sprite-label">FRANCOIS</div>
        </div>

        <div class="interact-prompt" id="interact-prompt">Press SPACE to battle!</div>
        <div class="movement-hint">Arrow keys to move</div>
      </div>
    </div>

    <!-- Battle Screen -->
    <div id="battle-screen" class="screen">
      <div class="battle-scene">
        <div class="opponent-area">
          <div class="battle-sprite" id="opponent-sprite">
            <div class="human-sprite chad-sprite">
              <div class="sprite-hair"></div>
              <div class="sprite-head"></div>
              <div class="sprite-body"></div>
              <div class="sprite-legs"></div>
            </div>
          </div>
          <div class="hp-bar-container">
            <div class="hp-label">
              <span id="opponent-name">OPPONENT</span>
              <span id="opponent-hp-text">100/100</span>
            </div>
            <div class="hp-bar">
              <div class="hp-fill" id="opponent-hp-fill" style="width: 100%"></div>
            </div>
          </div>
        </div>

        <div class="player-area">
          <div class="hp-bar-container">
            <div class="hp-label">
              <span id="player-battle-name">YOU</span>
              <span id="player-hp-text">100/100</span>
            </div>
            <div class="hp-bar">
              <div class="hp-fill" id="player-hp-fill" style="width: 100%"></div>
            </div>
          </div>
          <div class="battle-sprite" id="player-battle-sprite">
            <div class="human-sprite player-sprite">
              <div class="sprite-hair"></div>
              <div class="sprite-head"></div>
              <div class="sprite-body"></div>
              <div class="sprite-legs"></div>
            </div>
          </div>
        </div>

        <div class="loading-overlay" id="loading-overlay">
          <div class="loading-text">
            <div class="spinner"></div>
            <span id="loading-message">Waiting for TX...</span>
          </div>
        </div>
      </div>

      <div class="battle-ui">
        <div class="battle-log" id="battle-log">
          <div class="log-entry">Battle started!</div>
        </div>
        <div class="move-buttons">
          <button class="move-btn" data-move="0">
            <span class="move-name">Cold Email</span>
            <span class="move-damage">10 DMG / 0.01 USD</span>
          </button>
          <button class="move-btn" data-move="1">
            <span class="move-name">Case Crack</span>
            <span class="move-damage">25 DMG / 0.025 USD</span>
          </button>
          <button class="move-btn" data-move="2">
            <span class="move-name">Network Blitz</span>
            <span class="move-damage">40 DMG / 0.04 USD</span>
          </button>
          <button class="move-btn" data-move="3">
            <span class="move-name">Disrupt</span>
            <span class="move-damage">60 DMG / 0.06 USD</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="screen">
      <div class="result-content">
        <div class="result-title" id="result-title">VICTORY!</div>
        <div class="result-stats" id="result-stats"></div>
        <div class="tx-list" id="tx-list"></div>
        <button class="play-again-btn" id="play-again-btn">Continue</button>
      </div>
    </div>
  </div>

  <script>
    // ========================================
    // GAME STATE
    // ========================================
    let config = null;
    let playerName = 'PLAYER';
    let playerAddress = null;
    let currentTrainer = null;
    let playerHP = 100;
    let trainerHP = 100;
    let battleTxs = [];
    let isPlayerTurn = true;
    let battleActive = false;

    // Player position (start near center-bottom)
    let playerX = 380;
    let playerY = 540;
    const MOVE_SPEED = 8;
    const SPRITE_WIDTH = 32;
    const SPRITE_HEIGHT = 48;

    // Trainer positions (will be read from DOM)
    let trainers = [];
    let nearbyTrainer = null;

    // Player move definitions
    const PLAYER_MOVES = [
      { name: 'Cold Email', damage: 10, txAmount: '0.01', hitChance: 1.0 },
      { name: 'Case Crack', damage: 25, txAmount: '0.025', hitChance: 0.95 },
      { name: 'Network Blitz', damage: 40, txAmount: '0.04', hitChance: 0.85 },
      { name: 'Disrupt', damage: 60, txAmount: '0.06', hitChance: 0.70 },
    ];

    // Trainer-specific moves
    const TRAINER_MOVES = {
      // Chad - PE Bro
      0: [
        { name: 'Hostile LBO', damage: 15, txAmount: '0.015', hitChance: 1.0 },
        { name: 'Management Fee', damage: 25, txAmount: '0.025', hitChance: 0.95 },
        { name: 'Roll-Up Strategy', damage: 40, txAmount: '0.04', hitChance: 0.85 },
        { name: 'Dividend Recap', damage: 55, txAmount: '0.055', hitChance: 0.75 },
      ],
      // Priya - The Founder/VC
      1: [
        { name: 'Pre-empt Term Sheet', damage: 15, txAmount: '0.015', hitChance: 1.0 },
        { name: 'LP Clawback', damage: 30, txAmount: '0.03', hitChance: 0.90 },
        { name: 'Lead Eng Quits', damage: 45, txAmount: '0.045', hitChance: 0.80 },
        { name: 'Down Round', damage: 60, txAmount: '0.06', hitChance: 0.70 },
      ],
      // François - The Consultant
      2: [
        { name: '2x2 Matrix', damage: 10, txAmount: '0.01', hitChance: 1.0 },
        { name: 'Boil The Ocean', damage: 20, txAmount: '0.02', hitChance: 0.95 },
        { name: 'Synergy Attack', damage: 35, txAmount: '0.035', hitChance: 0.85 },
        { name: 'Scope Creep', damage: 50, txAmount: '0.05', hitChance: 0.75 },
      ],
    };

    const TRAINER_SPRITES = ['chad-sprite', 'priya-sprite', 'francois-sprite'];
    const TRAINER_TAUNTS = [
      "I modeled this outcome three ways.",
      "My Series A closes Thursday.",
      "Let me framework that for you."
    ];

    // ========================================
    // INITIALIZATION
    // ========================================
    async function init() {
      console.log('Initializing game...');

      // Load config from server
      try {
        const response = await fetch('/api/config');
        config = await response.json();
        console.log('Config loaded:', config);
      } catch (error) {
        console.error('Failed to load config:', error);
        alert('Failed to load game config. Make sure the server is running.');
        return;
      }

      playerAddress = config.playerAddress;

      // Set up event listeners
      document.getElementById('start-btn').addEventListener('click', () => showScreen('name-screen'));

      document.getElementById('name-submit').addEventListener('click', submitName);
      document.getElementById('name-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') submitName();
      });

      document.getElementById('play-again-btn').addEventListener('click', () => showScreen('overworld-screen'));

      // Move button listeners
      document.querySelectorAll('.move-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          if (battleActive && isPlayerTurn) {
            playerAttack(parseInt(btn.dataset.move));
          }
        });
      });

      // Keyboard controls - listen on both document and window
      document.addEventListener('keydown', handleKeyDown);
      window.addEventListener('keydown', handleKeyDown);

      // Initialize trainer positions
      initTrainers();

      console.log('Game initialized!');
    }

    function submitName() {
      const input = document.getElementById('name-input');
      playerName = input.value.trim().toUpperCase() || 'PLAYER';
      document.getElementById('player-label').textContent = playerName;
      document.getElementById('player-battle-name').textContent = playerName;
      showScreen('overworld-screen');
    }

    function initTrainers() {
      document.querySelectorAll('.trainer').forEach((el, index) => {
        const rect = el.getBoundingClientRect();
        const parent = document.getElementById('overworld').getBoundingClientRect();
        trainers.push({
          element: el,
          index: parseInt(el.dataset.trainer),
          x: parseInt(el.style.left),
          y: parseInt(el.style.top),
          name: config.trainers[index]?.name || `Trainer ${index + 1}`
        });
      });
    }

    // ========================================
    // SCREEN MANAGEMENT
    // ========================================
    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');

      if (screenId === 'overworld-screen') {
        updatePlayerPosition();
        checkNearbyTrainer();
        // Focus game container for keyboard input
        document.getElementById('game-container').focus();
      }
    }

    // ========================================
    // OVERWORLD MOVEMENT
    // ========================================
    function handleKeyDown(e) {
      const activeScreen = document.querySelector('.screen.active');
      if (activeScreen.id !== 'overworld-screen') return;

      // Prevent default for movement keys
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd', ' '].includes(e.key)) {
        e.preventDefault();
      }

      const bounds = {
        left: 50,
        right: 800 - SPRITE_WIDTH - 10,
        top: 150,
        bottom: 600 - SPRITE_HEIGHT - 10
      };

      let newX = playerX;
      let newY = playerY;

      switch(e.key) {
        case 'ArrowUp':
        case 'w':
        case 'W':
          newY = Math.max(bounds.top, playerY - MOVE_SPEED);
          break;
        case 'ArrowDown':
        case 's':
        case 'S':
          newY = Math.min(bounds.bottom, playerY + MOVE_SPEED);
          break;
        case 'ArrowLeft':
        case 'a':
        case 'A':
          newX = Math.max(bounds.left, playerX - MOVE_SPEED);
          break;
        case 'ArrowRight':
        case 'd':
        case 'D':
          newX = Math.min(bounds.right, playerX + MOVE_SPEED);
          break;
        case ' ':
          if (nearbyTrainer !== null) {
            startBattle(nearbyTrainer);
          }
          return;
      }

      // Check collision with trainers
      if (!checkTrainerCollision(newX, newY)) {
        playerX = newX;
        playerY = newY;
        updatePlayerPosition();
      }

      checkNearbyTrainer();
    }

    function checkTrainerCollision(x, y) {
      for (const trainer of trainers) {
        const dx = Math.abs((x + SPRITE_WIDTH/2) - (trainer.x + SPRITE_WIDTH/2));
        const dy = Math.abs((y + SPRITE_HEIGHT/2) - (trainer.y + SPRITE_HEIGHT/2));
        if (dx < SPRITE_WIDTH && dy < SPRITE_HEIGHT) {
          return true;
        }
      }
      return false;
    }

    function checkNearbyTrainer() {
      nearbyTrainer = null;
      const prompt = document.getElementById('interact-prompt');

      for (const trainer of trainers) {
        const dx = Math.abs((playerX + SPRITE_WIDTH/2) - (trainer.x + SPRITE_WIDTH/2));
        const dy = Math.abs((playerY + SPRITE_HEIGHT/2) - (trainer.y + SPRITE_HEIGHT/2));
        if (dx < SPRITE_WIDTH * 1.5 && dy < SPRITE_HEIGHT * 1.5) {
          nearbyTrainer = trainer.index;
          prompt.classList.add('active');
          return;
        }
      }

      prompt.classList.remove('active');
    }

    function updatePlayerPosition() {
      const player = document.getElementById('player');
      player.style.left = playerX + 'px';
      player.style.top = playerY + 'px';
    }

    // ========================================
    // BATTLE LOGIC
    // ========================================
    function startBattle(trainerIndex) {
      currentTrainer = {
        index: trainerIndex,
        ...config.trainers[trainerIndex]
      };

      // Reset battle state
      playerHP = 100;
      trainerHP = 100;
      battleTxs = [];
      isPlayerTurn = true;
      battleActive = true;

      // Update UI
      document.getElementById('opponent-name').textContent = currentTrainer.name.toUpperCase();

      // Update opponent sprite
      const opponentSprite = document.getElementById('opponent-sprite');
      opponentSprite.innerHTML = `
        <div class="human-sprite ${TRAINER_SPRITES[trainerIndex]}">
          <div class="sprite-hair"></div>
          <div class="sprite-head"></div>
          <div class="sprite-body"></div>
          <div class="sprite-legs"></div>
        </div>
      `;

      updateHPBars();

      // Clear battle log
      document.getElementById('battle-log').innerHTML = `
        <div class="log-entry">${currentTrainer.name} wants to battle!</div>
        <div class="log-entry">"${TRAINER_TAUNTS[trainerIndex]}"</div>
      `;

      // Update move buttons with trainer-specific attacks
      updateMoveButtons(trainerIndex);

      setMovesEnabled(true);
      showScreen('battle-screen');
    }

    function updateMoveButtons(trainerIndex) {
      const moves = TRAINER_MOVES[trainerIndex] || PLAYER_MOVES;
      const buttons = document.querySelectorAll('.move-btn');

      buttons.forEach((btn, i) => {
        if (moves[i]) {
          btn.querySelector('.move-name').textContent = moves[i].name;
          btn.querySelector('.move-damage').textContent = `${moves[i].damage} DMG / ${moves[i].txAmount} USD`;
        }
      });
    }

    async function playerAttack(moveIndex) {
      if (!battleActive || !isPlayerTurn) return;

      const moves = TRAINER_MOVES[currentTrainer.index] || PLAYER_MOVES;
      const move = moves[moveIndex];
      isPlayerTurn = false;
      setMovesEnabled(false);

      const hit = Math.random() < move.hitChance;

      if (!hit) {
        addBattleLog(`Your ${move.name} missed!`);
        setTimeout(() => trainerTurn(), 1000);
        return;
      }

      showLoading('Sending TX...');

      try {
        addBattleLog(`You used ${move.name}!`);

        const response = await fetch('/api/player-attack', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            trainerIndex: currentTrainer.index,
            amount: move.txAmount
          })
        });

        const result = await response.json();
        hideLoading();

        if (!result.success) {
          throw new Error(result.message || 'TX failed');
        }

        battleTxs.push({
          from: 'player',
          hash: result.txHash,
          amount: move.txAmount,
          move: move.name
        });

        trainerHP = Math.max(0, trainerHP - move.damage);
        updateHPBars();
        animateHit('opponent');

        addBattleLog(`<span class="damage">Dealt ${move.damage} damage!</span>`);
        addBattleLog(`<a class="tx-hash" href="${config.explorerUrl}/tx/${result.txHash}" target="_blank">TX: ${result.txHash.slice(0, 10)}...</a>`);

        if (trainerHP <= 0) {
          endBattle(true);
          return;
        }

        setTimeout(() => trainerTurn(), 1500);

      } catch (error) {
        hideLoading();
        console.error('TX failed:', error);
        addBattleLog(`TX failed: ${error.message}`);
        isPlayerTurn = true;
        setMovesEnabled(true);
      }
    }

    async function trainerTurn() {
      if (!battleActive) return;

      const trainerMoves = TRAINER_MOVES[currentTrainer.index] || PLAYER_MOVES;
      const moveIndex = Math.floor(Math.random() * trainerMoves.length);
      const move = trainerMoves[moveIndex];
      const hit = Math.random() < move.hitChance;

      addBattleLog(`${currentTrainer.name} used ${move.name}!`);

      if (!hit) {
        addBattleLog(`${currentTrainer.name}'s attack missed!`);
        setTimeout(() => {
          isPlayerTurn = true;
          setMovesEnabled(true);
        }, 1000);
        return;
      }

      showLoading('Trainer attacking...');

      try {
        const response = await fetch('/api/trainer-attack', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            trainerIndex: currentTrainer.index,
            amount: move.txAmount
          })
        });

        const result = await response.json();
        hideLoading();

        if (!result.success) {
          throw new Error(result.message || 'TX failed');
        }

        battleTxs.push({
          from: 'trainer',
          hash: result.txHash,
          amount: move.txAmount,
          move: move.name
        });

        playerHP = Math.max(0, playerHP - move.damage);
        updateHPBars();
        animateHit('player');

        addBattleLog(`<span class="damage">You took ${move.damage} damage!</span>`);
        addBattleLog(`<a class="tx-hash" href="${config.explorerUrl}/tx/${result.txHash}" target="_blank">TX: ${result.txHash.slice(0, 10)}...</a>`);

        if (playerHP <= 0) {
          endBattle(false);
          return;
        }

        isPlayerTurn = true;
        setMovesEnabled(true);

      } catch (error) {
        hideLoading();
        addBattleLog(`Trainer TX failed. Your turn.`);
        isPlayerTurn = true;
        setMovesEnabled(true);
      }
    }

    function endBattle(playerWon) {
      battleActive = false;
      setMovesEnabled(false);

      const playerTxs = battleTxs.filter(tx => tx.from === 'player');
      const trainerTxs = battleTxs.filter(tx => tx.from === 'trainer');
      const playerTotal = playerTxs.reduce((sum, tx) => sum + parseFloat(tx.amount), 0);
      const trainerTotal = trainerTxs.reduce((sum, tx) => sum + parseFloat(tx.amount), 0);

      const title = document.getElementById('result-title');
      title.textContent = playerWon ? 'VICTORY!' : 'DEFEAT!';
      title.className = 'result-title ' + (playerWon ? 'win' : 'lose');

      document.getElementById('result-stats').innerHTML = `
        <div>Opponent: ${currentTrainer.name}</div>
        <div>Total TXs: ${battleTxs.length}</div>
        <div>You won: ${playerTotal.toFixed(3)} USD</div>
        <div>You lost: ${trainerTotal.toFixed(3)} USD</div>
        <div>Net: ${(playerTotal - trainerTotal).toFixed(3)} USD</div>
      `;

      document.getElementById('tx-list').innerHTML = battleTxs.map(tx => `
        <div>
          ${tx.from === 'player' ? '+' : '-'} ${tx.move}:
          <a href="${config.explorerUrl}/tx/${tx.hash}" target="_blank">${tx.hash.slice(0, 16)}...</a>
        </div>
      `).join('');

      setTimeout(() => showScreen('result-screen'), 1500);
    }

    // ========================================
    // UI HELPERS
    // ========================================
    function updateHPBars() {
      const playerFill = document.getElementById('player-hp-fill');
      const playerPercent = (playerHP / 100) * 100;
      playerFill.style.width = playerPercent + '%';
      playerFill.className = 'hp-fill' + (playerPercent <= 20 ? ' critical' : playerPercent <= 50 ? ' low' : '');
      document.getElementById('player-hp-text').textContent = `${playerHP}/100`;

      const trainerFill = document.getElementById('opponent-hp-fill');
      const trainerPercent = (trainerHP / 100) * 100;
      trainerFill.style.width = trainerPercent + '%';
      trainerFill.className = 'hp-fill' + (trainerPercent <= 20 ? ' critical' : trainerPercent <= 50 ? ' low' : '');
      document.getElementById('opponent-hp-text').textContent = `${trainerHP}/100`;
    }

    function animateHit(target) {
      const sprite = document.getElementById(target === 'player' ? 'player-battle-sprite' : 'opponent-sprite');
      sprite.classList.add('hit');
      setTimeout(() => sprite.classList.remove('hit'), 300);
    }

    function setMovesEnabled(enabled) {
      document.querySelectorAll('.move-btn').forEach(btn => btn.disabled = !enabled);
    }

    function addBattleLog(message) {
      const log = document.getElementById('battle-log');
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.innerHTML = message;
      log.appendChild(entry);
      log.scrollTop = log.scrollHeight;
    }

    function showLoading(message) {
      document.getElementById('loading-message').textContent = message;
      document.getElementById('loading-overlay').classList.add('active');
    }

    function hideLoading() {
      document.getElementById('loading-overlay').classList.remove('active');
    }

    // ========================================
    // START
    // ========================================
    document.addEventListener('DOMContentLoaded', () => {
      init().catch(err => {
        console.error('Init failed:', err);
        alert('Game failed to initialize: ' + err.message);
      });
    });
  </script>
</body>
</html>
